# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.1.2

package:
  name: "mojo-prometheus"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/prometheus -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/prometheus.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
    - mojo-pyformat >=0.2.0,<0.3
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler', upper_bound='x.x') }}
    - mojo-pyformat >=0.2.0,<0.3  # .mojoc loads only on the minor it was built with

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-prometheus
  license: Apache-2.0
  license_file: LICENSE
  summary: Prometheus metrics for Mojo
  repository: https://github.com/amarbaro/mojo-prometheus

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-prometheus
