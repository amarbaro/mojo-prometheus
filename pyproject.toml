[project]
name = "mojo-prometheus"
version = "0.1.2"
description = "Prometheus metrics for Mojo: counters, gauges, histograms, summaries with labels, text exposition byte-identical with prometheus_client"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[project.urls]
Homepage = "https://github.com/amarbaro/mojo-prometheus"
Repository = "https://github.com/amarbaro/mojo-prometheus"

[dependency-groups]
dev = ["prometheus-client==0.26.0"]

[tool.mojo]
packages = ["prometheus"]  # src/pyformat is a vendored copy for a clone build; the conda package carries only this one
deps = ["mojo-pyformat >=0.2.0,<0.3"]
